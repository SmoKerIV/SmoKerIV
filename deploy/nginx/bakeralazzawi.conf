# bakeralazzawi.com — static Vite build, served straight from disk.
# Releases live in /var/www/bakeralazzawi.com/releases/<id>; `current` is a
# symlink swapped atomically by scripts/deploy.sh. Certbot adds the 443 block.
#
# Install: copy to /etc/nginx/sites-available/bakeralazzawi, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`, then once DNS points
# here: `certbot --nginx -d bakeralazzawi.com -d www.bakeralazzawi.com`.

server {
    server_name bakeralazzawi.com www.bakeralazzawi.com;

    root /var/www/bakeralazzawi.com/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Hashed bundles never change under the same name.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Licensed glTF props (not in git, uploaded with each release).
    location /models/ {
        types { model/gltf-binary glb; }
        expires 30d;
        try_files $uri =404;
    }

    location /draco/ {
        types { application/javascript js; application/wasm wasm; }
        expires 30d;
        try_files $uri =404;
    }

    location /audio/ {
        types { audio/webm webm; audio/mp4 m4a; application/json json; }
        expires 30d;
        try_files $uri =404;

        # Manifests change with every deploy; browsers must revalidate (304 when unchanged).
        location ~ /manifest\.json$ {
            expires -1;
            try_files $uri =404;
        }
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/bakeralazzawi.access.log;
    error_log  /var/log/nginx/bakeralazzawi.error.log;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/bakeralazzawi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bakeralazzawi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.bakeralazzawi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = bakeralazzawi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name bakeralazzawi.com www.bakeralazzawi.com;
    return 404; # managed by Certbot




}